codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: nearest
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%

    patch:
      default:
        target: 80%
        threshold: 5%

ignore:
  - "**/*_test.go"
  - "**/mock/**"
  - "**/mocks/**"
  - "**/testdata/**"
  - "**/vendor/**"
  - "**/examples/**"
