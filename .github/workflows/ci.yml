name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  go:
    name: Go Test + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - run: go version
      - run: go mod download
      - run: go mod verify

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - run: |
          go test \
            -race \
            -count=1 \
            -covermode=atomic \
            -coverprofile=coverage-go.out \
            ./...

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-go
          path: coverage-go.out
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build Binary
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: make build
      - run: ./bin/izen --version

  debug:
    name: Debug Checkout
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          git log --oneline -1

          echo
          echo "===== STATUS ====="
          git status

          echo
          echo "===== SEARCH ====="
          grep -R "func wrapText" internal || true
          grep -R "func formatCompactField" internal || true

          echo
          echo "===== UTILS ====="
          sed -n '1,120p' internal/ui/utils.go
